name: Build and Release Jarvis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ui
        run: npm install
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            ui/dist/*.AppImage
            ui/dist/*.snap
            ui/dist/*.deb
            ui/dist/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ui
        run: npm install
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: ui/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ui
        run: npm install
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ui/dist/*.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
